spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  data:
    mongodb:
      uri: ${MONGO_URI_AI:${MONGO_URI:mongodb://localhost:27017/fitnessrecommendation}}
  mongodb:
    uri: ${MONGO_URI_AI:${MONGO_URI:mongodb://localhost:27017/fitnessrecommendation}}

  rabbitmq:
    addresses: ${CLOUDAMQP_URL:${RABBITMQ_URL:${SPRING_RABBITMQ_ADDRESSES:${SPRING_RABBITMQ_URI:}}}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false

server:
  port: 8083

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER:false}
    fetch-registry: ${EUREKA_CLIENT_FETCH:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
  dlx:
    exchange:
      name: fitness.exchange.dlx
    queue:
      name: activity.queue.dlq
    routing:
      key: activity.tracking.dlq

grok:
  api:
    url: ${GROK_API_URL:https://api.groq.com/openai/v1/chat/completions}
    key: ${GROK_API_KEY:}
    model: ${GROK_MODEL:openai/gpt-oss-20b}


