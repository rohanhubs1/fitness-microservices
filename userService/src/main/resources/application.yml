spring:
  application:
    name: user-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/fitness_user_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:${DB_PASSWORD:postgres}}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER:false}
    fetch-registry: ${EUREKA_CLIENT_FETCH:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true


